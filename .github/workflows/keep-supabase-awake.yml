# Supabase's free plan pauses a project after about a week without activity. This reads the
# public roadmap every few days so the career pages never go to sleep. It uses only the
# publishable (public, read-only) key; no secrets.
name: Keep roadmap database awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://oglarrovddxvyqxeodqv.supabase.co/rest/v1/stages?select=slug&limit=1" \
            -H "apikey: sb_publishable_Nu0lfr1aKaE_h0FAcRggEw__kVbatep" > /dev/null
