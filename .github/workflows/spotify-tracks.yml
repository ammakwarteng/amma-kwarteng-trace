name: Sync Spotify top tracks

# Refreshes src/data/tracks.json once a day from Amma's Spotify account.
# Credentials live only in repository secrets; the saved file holds public
# track details (song, artists, album art, link) and nothing secret.

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: write           # to commit the updated tracks.json

concurrency:
  group: spotify-tracks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch top tracks
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_TIME_RANGE: long_term
          SPOTIFY_LIMIT: "5"
        run: node scripts/fetch-spotify-tracks.mjs

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- src/data/tracks.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tracks.json
          git commit -m "Update Spotify top tracks"
          git push
